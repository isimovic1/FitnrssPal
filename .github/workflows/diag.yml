name: OFF diagnostics
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='FitnrssPal/1.0 (personal calorie tracker)'
          F='code,product_name,product_name_hr,brands,nutriments,nutrition_data_per,serving_size,serving_quantity'
          for code in 3850354005995 87157239; do
            echo "== product $code (app UA)"
            curl -sS -A "$UA" -o out.json -w 'HTTP %{http_code} %{content_type} %{size_download}B\n' "https://world.openfoodfacts.org/api/v2/product/$code.json?fields=$F" || true
            head -c 700 out.json; echo
          done
          echo "== product okhttp UA"
          curl -sS -A 'okhttp/4.12.0' -o out.json -w 'HTTP %{http_code}\n' "https://world.openfoodfacts.org/api/v2/product/3850354005995.json?fields=$F" || true; head -c 300 out.json; echo
          echo "== search.pl"
          curl -sS -A "$UA" -o out.json -w 'HTTP %{http_code} %{content_type}\n' "https://world.openfoodfacts.org/cgi/search.pl?search_terms=banana&search_simple=1&action=process&json=1&page_size=5&fields=$F" || true; head -c 500 out.json; echo
          echo "== search-a-licious"
          curl -sS -A "$UA" -o out.json -w 'HTTP %{http_code} %{content_type}\n' "https://search.openfoodfacts.org/search?q=banana&page_size=3&fields=code,product_name,brands,nutriments" || true; head -c 900 out.json; echo
          echo "== heineken"
          curl -sS -A "$UA" -o out.json -w 'HTTP %{http_code}\n' "https://search.openfoodfacts.org/search?q=heineken&page_size=2&fields=code,product_name,brands" || true; head -c 500 out.json; echo
